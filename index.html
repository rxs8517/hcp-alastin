<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Practice 360">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<title>ALASTIN Practice 360° Phone Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#3C2F55; --purple-deep:#241B36; --purple-soft:#6B5C86;
  --accent:#7B6BA0; --accent-deep:#5B4C7D;
  --bg:#F1EFF2; --bg2:#E3E0E5;
  --ink:#1E1E1E; --ink-soft:#585858; --mut:#6F7278; --gray-soft:#A4A8A9;
  --line:#E3E0E5; --card:#ffffff; --card-line:#EAE7EE;
  --alert:#700002; --alert-bg:#FBF4F4;
  --lilac:#C2BACE; --lilac-soft:#E3E0E5;
  --seg-new:#9A93AC; --seg-growth:#6B5C86; --seg-risk:#700002; --seg-champ:#3C2F55;
  --good:#4C6B58;
  --fs:1;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Figtree','Helvetica Neue',Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1200px 700px at 12% -10%, #fff 0%, rgba(255,255,255,0) 55%),
    radial-gradient(1000px 800px at 110% 120%, #E3E0E5 0%, rgba(227,224,229,0) 60%),
    linear-gradient(160deg,var(--bg) 0%, var(--bg2) 100%);
  color:var(--ink);
  min-height:100%;
  -webkit-font-smoothing:antialiased;
}
.display{font-family:'Montserrat','Helvetica Neue',Arial,sans-serif}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;
  background-image:linear-gradient(rgba(60,47,85,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(60,47,85,.05) 1px,transparent 1px);
  background-size:46px 46px;}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:40px 28px 64px;
  display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:54px;align-items:start}

/* ---------------- Console ---------------- */
.console{position:sticky;top:40px;order:2}
.console .kicker{font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--purple);
  text-transform:uppercase;display:inline-block;background:#fff;border:1px solid var(--line);
  padding:7px 13px;border-radius:9px}
.console h1{font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:36px;font-weight:400;line-height:1.1;margin:18px 0 8px;letter-spacing:0}
.console h1 .hl{color:var(--purple)}
.console p.lede{font-size:15px;color:var(--ink-soft);line-height:1.55;max-width:46ch}
.panel{background:rgba(255,255,255,.74);backdrop-filter:blur(6px);border:1px solid var(--line);
  border-radius:18px;padding:18px 18px 20px;margin-top:22px;box-shadow:0 18px 40px -28px rgba(36,27,54,.45)}
.panel h2{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:12px}
.ctl-label{font-size:12.5px;font-weight:600;color:var(--ink-soft);margin:14px 0 7px}
.ctl-label:first-of-type{margin-top:0}
.seg-row,.role-row{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-family:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:#fff;
  color:var(--ink-soft);padding:8px 12px;border-radius:11px;cursor:pointer;transition:.16s;line-height:1}
.chip:hover{border-color:var(--purple-soft);color:var(--purple)}
.chip[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
.chip.seg[aria-pressed="true"][data-seg="new"]{background:var(--seg-new);border-color:var(--seg-new)}
.chip.seg[aria-pressed="true"][data-seg="growth"]{background:var(--seg-growth);border-color:var(--seg-growth)}
.chip.seg[aria-pressed="true"][data-seg="risk"]{background:var(--seg-risk);border-color:var(--seg-risk)}
.chip.seg[aria-pressed="true"][data-seg="champ"]{background:var(--seg-champ);border-color:var(--seg-champ)}
.notes{margin-top:18px;border-top:1px dashed var(--line);padding-top:14px}
.notes li{list-style:none;font-size:12.5px;color:var(--ink-soft);line-height:1.5;padding-left:20px;position:relative;margin-bottom:8px}
.notes li::before{content:"";position:absolute;left:0;top:7px;width:8px;height:8px;border-radius:3px;
  background:linear-gradient(135deg,var(--accent),var(--purple))}
.reset{margin-top:16px;width:100%;font-family:inherit;font-size:13px;font-weight:700;color:var(--purple);
  background:#fff;border:1.5px solid #DEDAE6;border-radius:12px;padding:11px;cursor:pointer;transition:.16s}
.reset:hover{background:#F8F7FA;border-color:var(--purple)}
.disclaimer{font-size:11px;color:var(--mut);line-height:1.5;margin-top:18px}

/* ---------------- Phone ---------------- */
.stage{order:1;display:flex;justify-content:center}
@media (max-height:900px){.wrap{padding-top:22px;padding-bottom:28px}.console{top:22px}}
.phone{position:relative;width:390px;border-radius:52px;background:#1E1B26;
  /* the phone must fit the browser window, or the bottom bar — tab bar, save
     bar, or the SMS composer holding the reply chips — falls below the fold
     and the demo looks broken. .screen is a flex column, so losing height
     just shortens the scrolling area. */
  height:830px; height:min(830px, calc(100vh - 76px)); height:min(830px, calc(100dvh - 76px)); min-height:560px;
  padding:13px;box-shadow:0 50px 90px -40px rgba(30,27,38,.6),0 0 0 2px rgba(255,255,255,.04) inset;
  flex:0 0 auto}
.screen{position:relative;width:100%;height:100%;background:#fff;border-radius:40px;overflow:hidden;
  display:flex;flex-direction:column;font-size:calc(15px*var(--fs))}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:140px;height:26px;
  background:#1E1B26;border-radius:0 0 18px 18px;z-index:40}
.status{display:flex;align-items:center;justify-content:space-between;padding:12px 24px 6px;
  font-size:calc(13px*var(--fs));font-weight:600;color:#1E1E1E;flex:0 0 auto}
.status .dots{display:flex;align-items:center;gap:5px}
.status .bar{width:17px;height:11px;border:1.5px solid #1E1E1E;border-radius:3px;position:relative}
.status .bar::after{content:"";position:absolute;inset:1.5px;right:5px;background:#1E1E1E;border-radius:1px}
.sig{width:16px;height:11px;background:
  linear-gradient(to right,#1E1E1E 0 3px,transparent 3px 4px,#1E1E1E 4px 7px,transparent 7px 8px,#1E1E1E 8px 11px,transparent 11px 12px,#1E1E1E 12px 16px)}

/* app header */
.appbar{flex:0 0 auto;padding:6px 20px 12px;border-bottom:1px solid #EAE7EE;background:#fff;z-index:20}
.brand{display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.wordmark{font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-weight:500;letter-spacing:.22em;text-indent:.22em;font-size:calc(19px*var(--fs));color:var(--purple);line-height:1;text-transform:uppercase}
.wordmark .deg{color:var(--accent)}
.tag{font-size:calc(9.5px*var(--fs));color:var(--mut);font-weight:500;letter-spacing:.13em;text-transform:uppercase;margin-top:3px}
.appbar-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.prov-pill{font-size:calc(11.5px*var(--fs));font-weight:600;color:var(--purple);border:1px solid var(--card-line);
  background:#F8F7FA;border-radius:20px;padding:4px 12px}
.icon-btn{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);transition:.15s}
.icon-btn:hover{border-color:var(--purple-soft);color:var(--purple)}
.specialty{font-size:calc(11px*var(--fs));color:var(--purple);font-weight:600;display:flex;align-items:center;gap:6px;margin-top:6px}
.specialty .d{width:6px;height:6px;border-radius:50%;background:var(--purple)}

/* scroll body */
.body{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;background:#fff;-webkit-overflow-scrolling:touch}
.body::-webkit-scrollbar{width:0}

/* greeting */
.greet{margin:14px 20px 4px;border-radius:18px;padding:15px 16px;display:flex;gap:12px;align-items:center;color:#fff;
  background:linear-gradient(120deg,#56466F,var(--purple-deep))}
.greet .av{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:calc(16px*var(--fs))}
.greet .t1{font-weight:700;font-size:calc(15px*var(--fs));line-height:1.2}
.greet .t2{font-size:calc(11.5px*var(--fs));opacity:.92;margin-top:2px}

/* identity strip */
.idstrip{margin:12px 20px 2px;border:1px solid var(--card-line);border-radius:16px;padding:13px 14px;display:flex;gap:13px;align-items:center}
.idring{position:relative;width:58px;height:58px;flex:0 0 auto}
.idring .mono{position:absolute;inset:0;display:grid;place-items:center;font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:calc(19px*var(--fs));font-weight:600;color:var(--purple)}
.idmeta b{font-size:calc(13.5px*var(--fs));font-weight:700;display:block;line-height:1.15}
.idmeta span{font-size:calc(11px*var(--fs));color:var(--mut)}
.idtags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.minitag{font-size:calc(9.5px*var(--fs));font-weight:600;letter-spacing:.02em;padding:3px 8px;border-radius:14px;border:1px solid var(--line);background:#F9F8FB;color:var(--ink-soft)}
.minitag.gold{background:#F1EEF6;border-color:#DCD6E8;color:#4E4170}
.minitag.risk{background:var(--alert-bg);border-color:#E9CBCB;color:#5A0002}

/* personal message */
.pmsg-label{font-size:calc(11.5px*var(--fs));font-weight:700;padding:16px 20px 0}
.pmsg{margin:8px 20px 2px;border-radius:15px;padding:13px 14px;display:flex;gap:11px;align-items:flex-start;
  border:1px solid var(--card-line)}
.pmsg .ic{width:28px;height:28px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff}
.pmsg .ic svg{width:15px;height:15px}
.pmsg p{font-size:calc(12.5px*var(--fs));color:var(--ink-soft);line-height:1.42;font-weight:500}

/* snapshot stats */
.snap{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:14px 18px 4px}
.snap .s{border:1px solid var(--card-line);border-radius:14px;padding:11px 8px;text-align:center;background:#FAF9FB}
.snap .s .v{font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:calc(21px*var(--fs));font-weight:600;line-height:1}
.snap .s .l{font-size:calc(9.5px*var(--fs));color:var(--ink-soft);margin-top:5px;line-height:1.2}
.snap .s .d{font-size:calc(9px*var(--fs));margin-top:3px;font-weight:600}
.snap .s .d.up{color:var(--good)} .snap .s .d.down{color:var(--alert)} .snap .s .d.flat{color:var(--mut)}

/* section label */
.sec{font-size:calc(11.5px*var(--fs));font-weight:700;color:var(--purple);padding:18px 22px 9px;letter-spacing:.02em}

/* tiles — 3-col module grid (9 tiles, chosen by role + segment) */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:2px 18px 6px}
.tile{background:#fff;border:1px solid var(--card-line);border-radius:16px;padding:13px 6px 12px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;text-align:center;cursor:pointer;transition:.16s;position:relative;min-height:84px}
.tile:hover{border-color:var(--purple-soft);box-shadow:0 10px 22px -16px rgba(36,27,54,.5);transform:translateY(-2px)}
.tile .ic{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--purple);flex:none}
.tile .ic svg{width:24px;height:24px;stroke:var(--purple);fill:none;stroke-width:1.7}
.tile span{font-size:calc(10.5px*var(--fs));font-weight:600;color:#3A3742;line-height:1.18}
.tile .star{position:absolute;top:7px;right:8px;font-size:calc(9px*var(--fs));color:var(--accent)}

/* CTA */
.cta{margin:12px 20px 6px;border:1.5px solid var(--purple);color:var(--purple);font-weight:700;font-size:calc(13.5px*var(--fs));
  text-align:center;border-radius:24px;padding:12px;cursor:pointer;background:#fff;transition:.16s}
.cta:hover{background:var(--purple);color:#fff}
.cta.solid{background:var(--purple);color:#fff}
.cta.solid:hover{background:var(--purple-deep)}

/* tab bar */
.tabbar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px 0 12px;
  border-top:1px solid #EAE7EE;background:#fff;z-index:20}
.tb{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;
  border:none;transition:.16s;color:#fff}
.tb svg{width:19px;height:19px}
.tb.tt{background:var(--purple)} .tb.call{background:#56466F}
.tb:hover{filter:brightness(1.07);transform:translateY(-1px)}
.tb-ai{display:flex;align-items:center;gap:8px;font-weight:700;font-size:calc(13px*var(--fs));color:var(--purple-deep);
  border:2px solid transparent;border-radius:24px;padding:10px 18px;cursor:pointer;
  background:linear-gradient(#fff,#fff) padding-box,linear-gradient(120deg,var(--accent),var(--purple)) border-box;transition:.16s}
.tb-ai:hover{box-shadow:0 8px 20px -12px rgba(60,47,85,.6)}
.tb-ai svg{width:16px;height:16px}


/* role select */
.role-screen{flex:1;display:flex;flex-direction:column;padding:8px 22px 22px;overflow-y:auto}
.role-hero{padding:18px 0 6px}
.role-hero h2{font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:calc(25px*var(--fs));font-weight:400;line-height:1.18;letter-spacing:0}
.role-hero h2 .hl{color:var(--purple)}
.role-hero p{font-size:calc(13px*var(--fs));color:var(--ink-soft);margin-top:8px;line-height:1.5}
.role-list{margin-top:16px;display:flex;flex-direction:column;gap:11px}
.role-card{display:flex;align-items:center;gap:13px;border:1px solid var(--card-line);border-radius:16px;
  padding:15px 15px;cursor:pointer;background:#fff;transition:.16s}
.role-card:hover{border-color:var(--purple);box-shadow:0 12px 26px -18px rgba(36,27,54,.6);transform:translateY(-2px)}
.role-card .ric{width:42px;height:42px;border-radius:13px;background:#F3F1F6;display:flex;align-items:center;justify-content:center;
  color:var(--purple);flex:0 0 auto}
.role-card .ric svg{width:22px;height:22px;stroke:var(--purple);fill:none;stroke-width:1.8}
.role-card .rt b{font-size:calc(14.5px*var(--fs));font-weight:700;display:block}
.role-card .rt span{font-size:calc(11.5px*var(--fs));color:var(--mut)}
.role-card .arr{margin-left:auto;color:var(--mut)}

/* detail */
.detail{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#fff}
.dhead{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px 12px;border-bottom:1px solid #EAE7EE}
.back{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:.15s;flex:0 0 auto}
.back:hover{border-color:var(--purple);color:var(--purple)}
.dhead .dt{font-size:calc(15px*var(--fs));font-weight:700}
.dhead .dt small{display:block;font-size:calc(10.5px*var(--fs));color:var(--mut);font-weight:500}
.dbody{flex:1;overflow-y:auto;padding:18px 20px 24px}
.dbody::-webkit-scrollbar{width:0}
.stat-row{display:flex;gap:11px;margin-bottom:16px}
.stat{flex:1;border:1px solid var(--card-line);border-radius:15px;padding:14px 10px;text-align:center;background:#FAF9FB}
.stat .big{font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:calc(27px*var(--fs));font-weight:600;color:var(--purple);line-height:1}
.stat .big.gold{color:var(--accent)}
.stat .lbl{font-size:calc(10px*var(--fs));color:var(--ink-soft);margin-top:6px;line-height:1.25}
.stat .vs{font-size:calc(9.5px*var(--fs));color:var(--mut);margin-top:4px}
.dbody h3{font-size:calc(13.5px*var(--fs));font-weight:700;margin:18px 0 8px;color:var(--ink)}
.dbody h3:first-child{margin-top:0}
.dbody p{font-size:calc(12.5px*var(--fs));color:var(--ink-soft);line-height:1.55;margin-bottom:10px}
.kv{border:1px solid var(--card-line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;font-size:calc(12.5px*var(--fs));border-bottom:1px solid #F1EFF2}
.kv div:last-child{border-bottom:none}
.kv div b{color:var(--ink);font-weight:600}
.kv div span{color:var(--ink-soft);text-align:right}
.bullet{display:flex;gap:10px;font-size:calc(12.5px*var(--fs));color:var(--ink-soft);line-height:1.5;margin-bottom:9px}
.bullet .b{width:7px;height:7px;border-radius:2px;background:linear-gradient(135deg,var(--accent),var(--purple));margin-top:6px;flex:0 0 auto}
.src{margin-top:14px;font-size:calc(10.5px*var(--fs));color:var(--mut);border-top:1px dashed var(--line);padding-top:10px;line-height:1.5}
.callout{border-left:3px solid var(--accent);background:#F8F6FB;border-radius:8px;padding:11px 13px;font-size:calc(12px*var(--fs));
  color:#453A63;line-height:1.5;margin-bottom:14px}
.callout.plum{border-left-color:var(--purple);background:#F7F5FA;color:#2E2444}

/* bars */
.bars{display:flex;flex-direction:column;gap:10px;margin:4px 0 6px}
.barrow{display:grid;grid-template-columns:1fr 44px;gap:6px 10px;align-items:center}
.barrow .nm{grid-column:1/3;font-size:calc(12px*var(--fs));color:var(--ink-soft);font-weight:500}
.barrow .nm small{color:var(--mut);font-weight:400}
.track{height:9px;background:#F1EFF2;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.track i{display:block;height:100%;border-radius:6px;background:var(--purple);transition:width .9s cubic-bezier(.22,1,.36,1)}
.track i.gold{background:var(--accent)} .track i.muted{background:#C2BACE}
.barrow .qty{font-size:calc(12px*var(--fs));font-weight:700;text-align:right;color:var(--ink)}

/* continuum */
.continuum{display:flex;margin:8px 0 6px}
.cstep{flex:1;text-align:center;position:relative;padding-top:24px}
.cstep::before{content:"";position:absolute;top:8px;left:0;right:0;height:2px;background:var(--line)}
.cstep:first-child::before{left:50%}.cstep:last-child::before{right:50%}
.cstep .dot{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--line);z-index:2}
.cstep.done .dot{background:var(--purple);border-color:var(--purple)}
.cstep.current .dot{background:#fff;border-color:var(--purple);box-shadow:0 0 0 4px #E9E6F0}
.cstep .lb{font-size:calc(11px*var(--fs));font-weight:600;color:var(--ink-soft)}
.cstep .sub{font-size:calc(9.5px*var(--fs));color:var(--mut)}
.cstep.todo .lb{color:var(--mut)}

/* course list */
.course{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
.course:first-child{border-top:none}
.course .cic{width:21px;height:21px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:calc(11px*var(--fs));font-weight:700;margin-top:1px}
.cic.done{background:#E9EFEB;color:var(--good)} .cic.prog{background:#F1EEF6;color:#4E4170} .cic.todo{background:#F9F8FB;color:var(--mut);border:1px solid var(--line)}
.course .cm h4{font-size:calc(12.5px*var(--fs));font-weight:600}
.course .cm p{font-size:calc(11px*var(--fs));color:var(--mut);margin:2px 0 0}
.course .ctag{margin-left:auto;font-size:calc(9.5px*var(--fs));font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--mut);white-space:nowrap;padding-top:2px}

/* NBA */
.nbaitem{display:flex;gap:11px;padding:13px 0;border-top:1px solid var(--line)}
.nbaitem:first-child{border-top:none}
.nbaitem .ix{font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:calc(14px*var(--fs));color:var(--purple);font-weight:600;width:20px;flex:none}
.nbaitem h4{font-size:calc(12.5px*var(--fs));font-weight:600}
.nbaitem p{font-size:calc(11.5px*var(--fs));color:var(--ink-soft);margin:3px 0 0;line-height:1.45}
.nbaitem .why{font-size:calc(10.5px*var(--fs));color:var(--mut);margin-top:4px}

/* NAVIGATOR */
.navwrap{display:flex;flex-direction:column;gap:4px}
.flab{font-size:calc(10px*var(--fs));letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:14px 0 7px;font-weight:700}
.flab:first-child{margin-top:0}
.nchips{display:flex;flex-wrap:wrap;gap:6px}
.nchip{font-family:inherit;font-size:calc(11.5px*var(--fs));font-weight:500;cursor:pointer;padding:7px 11px;border-radius:9px;
  border:1px solid var(--line);background:#fff;color:var(--ink-soft);transition:.12s}
.nchip:hover{border-color:var(--purple)}
.nchip[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
.nseg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.nseg button{flex:1;appearance:none;border:none;background:#fff;font-family:inherit;font-size:calc(11.5px*var(--fs));font-weight:500;
  padding:8px 4px;cursor:pointer;color:var(--ink-soft);border-right:1px solid var(--line);transition:.12s}
.nseg button:last-child{border-right:none}
.nseg button[aria-pressed="true"]{background:#F3F1F6;color:var(--purple-deep);font-weight:600}
.reco{margin-top:16px;border:1px solid var(--card-line);border-radius:14px;padding:15px 15px;background:#FAF9FB;animation:fade .3s ease}
.reco .brandname{font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:calc(18px*var(--fs));font-weight:600;color:var(--purple-deep);line-height:1.1}
.reco .area{display:inline-block;font-size:calc(10px*var(--fs));font-weight:600;letter-spacing:.03em;text-transform:uppercase;
  color:var(--purple-deep);background:#E9E6F0;border:1px solid #D6D0E0;padding:3px 9px;border-radius:14px;margin-top:8px}
.reco h5{font-size:calc(10px*var(--fs));letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:15px 0 7px;font-weight:700}
.reco ul{margin:0;padding-left:17px}
.reco ul li{font-size:calc(11.5px*var(--fs));color:var(--ink-soft);margin-bottom:5px;line-height:1.45}
.reco .tie{display:flex;gap:9px;margin-top:14px;padding:11px 12px;border-radius:9px;background:#F1EEF6;border:1px solid #DCD6E8}
.reco .tie p{margin:0;font-size:calc(11px*var(--fs));color:#453A63;line-height:1.45}
.reco .tie b{color:#3B3155}
.navempty{margin-top:16px;border:1px dashed var(--line);border-radius:14px;padding:26px 18px;text-align:center;color:var(--mut)}
.navempty .big{font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:calc(16px*var(--fs));color:var(--ink-soft);margin-bottom:5px}

/* cohort */
.cohort{display:grid;grid-template-columns:1fr auto auto;gap:9px 14px;align-items:center;margin:6px 0 2px}
.cohort .ch{font-size:calc(9.5px*var(--fs));letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:right}
.cohort .ch.l{text-align:left}
.cohort .mt{font-size:calc(11.5px*var(--fs));color:var(--ink-soft)}
.cohort .nm2{font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:calc(16px*var(--fs));font-weight:600;text-align:right}
.cohort .nm2.en{color:var(--accent)} .cohort .nm2.non{color:var(--mut)}
.cohort .divider{grid-column:1/-1;height:1px;background:var(--line)}

/* projector */
.projbox{border:1px solid var(--card-line);border-radius:14px;padding:15px;background:#FAF9FB;margin-top:6px}
.projhead{display:flex;align-items:baseline;justify-content:space-between}
.projhead .lab{font-size:calc(10px*var(--fs));letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700}
.projhead .val{font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:calc(30px*var(--fs));font-weight:600;color:var(--accent);line-height:1}
input[type=range]{width:100%;accent-color:var(--accent);height:4px;margin:10px 0 2px}
.prow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.prow:last-child{border-bottom:none}
.prow .pl{font-size:calc(11.5px*var(--fs));color:var(--ink-soft);max-width:22ch}
.prow .pv{font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:calc(19px*var(--fs));font-weight:600;white-space:nowrap}
.prow .pv.gold{color:var(--accent)} .prow .pv.plum{color:var(--purple)}
.prow .pl small{display:block;font-size:calc(9.5px*var(--fs));color:var(--mut);font-weight:400}

/* gauge */
.gaugewrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:6px}
.gauge{position:relative;width:150px;height:90px;flex:none}
.gauge .glab{position:absolute;bottom:0;left:0;right:0;text-align:center}
.gauge .gv{font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:calc(28px*var(--fs));font-weight:600;line-height:1}
.gauge .gc{font-size:calc(9.5px*var(--fs));letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.driver{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-top:1px solid var(--line);font-size:calc(11.5px*var(--fs))}
.driver:first-child{border-top:none}
.driver .di{flex:none;width:17px;height:17px;border-radius:5px;display:grid;place-items:center;font-size:calc(10px*var(--fs));font-weight:700;margin-top:1px}
.di.bad{background:var(--alert-bg);color:var(--alert)} .di.mid{background:#F1EEF6;color:#4E4170}
.driver .dv{margin-left:auto;font-weight:600;color:var(--ink-soft);white-space:nowrap}

/* timeline */
.tl{position:relative;margin:4px 0 2px;padding-left:17px}
.tl::before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 14px 4px}
.tli:last-child{padding-bottom:0}
.tli .td{position:absolute;left:-17px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--purple);border:2px solid #fff}
.tli.gold .td{background:var(--accent)} .tli.good .td{background:var(--good)}
.tli .tdt{font-size:calc(9.5px*var(--fs));letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.tli .ttx{font-size:calc(12px*var(--fs));color:var(--ink-soft);margin-top:1px}
.tli .ttx b{color:var(--ink);font-weight:600}

/* plays */
.play{padding:11px 0;border-top:1px solid var(--line)}
.play:first-child{border-top:none}
.play h4{font-size:calc(12.5px*var(--fs));font-weight:600;display:flex;gap:8px;align-items:center}
.play h4 .pd{width:7px;height:7px;border-radius:50%;background:var(--purple);flex:none}
.play p{font-size:calc(11.5px*var(--fs));color:var(--mut);margin:3px 0 0;line-height:1.45}

/* faq accordion */
.faq{border:1px solid var(--card-line);border-radius:12px;margin-bottom:9px;overflow:hidden}
.faq .q{padding:11px 13px;font-size:calc(12px*var(--fs));font-weight:600;cursor:pointer;display:flex;gap:10px;align-items:center;color:var(--ink)}
.faq .q span{margin-left:auto;color:var(--purple);font-weight:700;flex:none}
.faq .a{padding:0 13px;max-height:0;overflow:hidden;transition:max-height .25s;font-size:calc(11.5px*var(--fs));color:var(--ink-soft);line-height:1.5}
.faq .a.open{padding:0 13px 12px;max-height:280px}

/* ---------- AI assistant ---------- */
.ai{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#FAF9FB}
.ai-head{flex:0 0 auto;display:flex;align-items:center;gap:11px;padding:10px 16px 11px;border-bottom:1px solid #EDEAF2;background:#fff}
.ai-head .orb{width:34px;height:34px;border-radius:50%;flex:0 0 auto;
  background:conic-gradient(from 200deg,var(--accent),var(--purple),var(--purple-deep),var(--accent));
  display:flex;align-items:center;justify-content:center;color:#fff}
.ai-head .orb svg{width:17px;height:17px}
.ai-head .at b{font-size:calc(14px*var(--fs));font-weight:700;display:block;line-height:1.1}
.ai-head .at span{font-size:calc(10.5px*var(--fs));color:var(--good);font-weight:600;display:flex;align-items:center;gap:5px}
.ai-head .at span i{width:6px;height:6px;border-radius:50%;background:var(--good);display:inline-block}
.ai-log{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:11px}
.ai-log::-webkit-scrollbar{width:0}
.msg{max-width:86%;font-size:calc(12.5px*var(--fs));line-height:1.5;padding:11px 13px;border-radius:16px}
.msg.bot{background:#fff;border:1px solid var(--card-line);color:var(--ink);align-self:flex-start;border-bottom-left-radius:5px}
.msg.me{background:var(--purple);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.msg .tag{display:inline-block;margin-top:8px;font-size:calc(9.5px*var(--fs));color:var(--mut);border-top:1px dashed var(--line);padding-top:6px}
.msg.escal{border-color:#EDCACA;background:var(--alert-bg)}
.msg.escal .tag{color:var(--alert);border-color:#EFD3D3}
.chips2{display:flex;flex-wrap:wrap;gap:7px;padding:4px 16px 10px}
.qchip{font-family:inherit;font-size:calc(11.5px*var(--fs));font-weight:600;color:var(--purple);background:#fff;
  border:1px solid var(--card-line);border-radius:16px;padding:8px 12px;cursor:pointer;transition:.15s}
.qchip:hover{border-color:var(--purple);background:#F8F7FA}
.ai-input{flex:0 0 auto;display:flex;gap:9px;padding:10px 14px 14px;border-top:1px solid #EDEAF2;background:#fff}
.ai-input input{flex:1;font-family:inherit;font-size:calc(13px*var(--fs));border:1px solid var(--line);border-radius:22px;
  padding:11px 16px;outline:none;color:var(--ink)}
.ai-input input:focus{border-color:var(--purple-soft)}
.ai-send{width:42px;height:42px;border-radius:50%;border:none;background:var(--purple);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ai-send:hover{background:var(--purple-deep)}
.typing{display:flex;gap:4px;align-items:center;padding:11px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* contacts */
.contacts{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#fff}
.cbody{flex:1;overflow-y:auto;padding:16px 18px 22px}
.cintro{font-size:calc(12.5px*var(--fs));color:var(--ink-soft);line-height:1.5;margin-bottom:16px}
.contact{display:flex;align-items:center;gap:13px;border:1px solid var(--card-line);border-radius:16px;padding:13px 14px;margin-bottom:11px}
.contact .av{width:46px;height:46px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:calc(15px*var(--fs))}
.contact .ct b{font-size:calc(14px*var(--fs));font-weight:700;display:block}
.contact .ct span{font-size:calc(11px*var(--fs));color:var(--mut)}
.contact .ct .role{font-size:calc(10.5px*var(--fs));color:var(--purple);font-weight:600}
.contact .cbtns{margin-left:auto;display:flex;gap:8px}
.cbtn{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;transition:.15s}
.cbtn.v{background:#56466F}.cbtn.p{background:var(--good)}
.cbtn:hover{filter:brightness(1.08)}

/* video call */
.vcall{position:absolute;inset:0;z-index:60;border-radius:40px;overflow:hidden;display:flex;flex-direction:column;
  background:radial-gradient(120% 80% at 50% 0%,#2A2040,#17131F);color:#fff}
.vc-top{padding:54px 22px 0;text-align:center}
.vc-top .nm{font-size:calc(19px*var(--fs));font-weight:700}
.vc-top .st{font-size:calc(12px*var(--fs));opacity:.7;margin-top:4px}
.vc-stage{flex:1;display:flex;align-items:center;justify-content:center}
.vc-av{width:118px;height:118px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;animation:pulse 2s infinite}
.vc-av svg{width:52px;height:52px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.22)}70%{box-shadow:0 0 0 26px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.vc-self{position:absolute;right:16px;top:64px;width:74px;height:104px;border-radius:16px;
  background:linear-gradient(160deg,#7A6B92,#332A48);border:1px solid rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6)}
.vc-bar{display:flex;align-items:center;justify-content:center;gap:14px;padding:0 0 40px}
.vbtn{width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.14);color:#fff;transition:.15s}
.vbtn:hover{background:rgba(255,255,255,.22)}
.vbtn.end{background:#8E2A2C;width:58px;height:58px}.vbtn.end:hover{background:#700002}
.vbtn svg{width:22px;height:22px}

/* toast */
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);z-index:70;
  background:#1A1A1A;color:#fff;font-size:calc(12px*var(--fs));font-weight:500;padding:11px 16px;border-radius:13px;
  opacity:0;transition:.25s;pointer-events:none;max-width:84%;text-align:center;box-shadow:0 14px 30px -12px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.fade{animation:fade .26s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- tile swap animation ---------- */
.tiles.swap .tile{animation:tilein .42s cubic-bezier(.22,1,.36,1) both}
@keyframes tilein{from{opacity:0;transform:translateY(9px) scale(.94)}to{opacity:1;transform:none}}
.segflash{animation:segflash .55s ease}
@keyframes segflash{0%{box-shadow:0 0 0 0 rgba(123,107,160,.5)}100%{box-shadow:0 0 0 14px rgba(123,107,160,0)}}

/* ---------- add-to-calendar buttons ---------- */
.calbtn{margin-left:auto;flex:none;font-family:inherit;font-size:calc(9.5px*var(--fs));font-weight:700;letter-spacing:.03em;
  color:var(--purple);background:#fff;border:1px solid #DEDAE6;border-radius:14px;padding:5px 9px;cursor:pointer;
  display:flex;align-items:center;gap:4px;white-space:nowrap;transition:.15s;margin-top:1px}
.calbtn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.calbtn:hover{background:var(--purple);border-color:var(--purple);color:#fff}
.calbtn.added{background:#EEF2F0;border-color:#CBD8CF;color:var(--good);cursor:default}
.calbtn.added:hover{background:#EEF2F0;color:var(--good)}

/* ---------- bottom sheet ---------- */
.sheetwrap{position:absolute;inset:0;z-index:65;border-radius:40px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.sheetscrim{position:absolute;inset:0;background:rgba(23,19,31,.42);animation:fade .2s ease}
.sheet{position:relative;background:#fff;border-radius:26px 26px 40px 40px;padding:8px 20px 22px;
  box-shadow:0 -18px 40px -22px rgba(30,27,38,.5);animation:sheetup .3s cubic-bezier(.22,1,.36,1)}
@keyframes sheetup{from{transform:translateY(102%)}to{transform:none}}
.sheet .grab{width:38px;height:4px;border-radius:3px;background:#E3E0E5;margin:0 auto 12px}
.sheet h3{font-size:calc(15px*var(--fs));font-weight:700;margin:0 0 2px}
.sheet .sub{font-size:calc(11.5px*var(--fs));color:var(--mut);margin-bottom:12px}
.calnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 8px}
.calnav b{font-size:calc(12.5px*var(--fs));font-weight:700}
.calnav button{width:26px;height:26px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;
  color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;transition:.15s}
.calnav button:hover{border-color:var(--purple);color:var(--purple)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.calgrid .dh{font-size:calc(9px*var(--fs));text-align:center;color:var(--mut);font-weight:700;letter-spacing:.04em;padding-bottom:3px}
.calday{aspect-ratio:1;border:1px solid transparent;border-radius:10px;background:#FAF9FB;font-family:inherit;
  font-size:calc(11.5px*var(--fs));color:var(--ink-soft);cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;transition:.13s;padding:0}
.calday:hover{border-color:var(--purple-soft)}
.calday.mute{background:transparent;color:#C2BACE;cursor:default}
.calday.mute:hover{border-color:transparent}
.calday.today{border-color:var(--accent);color:var(--accent-deep);font-weight:700}
.calday[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:#fff;font-weight:700}
.calday .ev{width:4px;height:4px;border-radius:50%;background:var(--accent)}
.calday[aria-pressed="true"] .ev{background:#fff}
.timerow{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.timechip{font-family:inherit;font-size:calc(11px*var(--fs));font-weight:600;border:1px solid var(--line);background:#fff;
  color:var(--ink-soft);padding:7px 11px;border-radius:10px;cursor:pointer;transition:.13s}
.timechip:hover{border-color:var(--purple)}
.timechip[aria-pressed="true"]{background:#F3F1F6;border-color:var(--purple);color:var(--purple-deep)}
.sheet .flab{margin:14px 0 6px}
.sheetbtns{display:flex;gap:9px;margin-top:16px}
.sheetbtns button{flex:1;font-family:inherit;font-size:calc(13px*var(--fs));font-weight:700;border-radius:22px;padding:12px;cursor:pointer;transition:.15s}
.sbtn-x{background:#fff;border:1.5px solid var(--line);color:var(--ink-soft)}
.sbtn-x:hover{border-color:var(--purple);color:var(--purple)}
.sbtn-ok{background:var(--purple);border:1.5px solid var(--purple);color:#fff}
.sbtn-ok:hover{background:var(--purple-deep);border-color:var(--purple-deep)}

/* ---------- calendar screen ---------- */
.calscreen{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#fff}
.calbody{flex:1;overflow-y:auto;padding:14px 18px 22px}
.calbody::-webkit-scrollbar{width:0}
.calcard{border:1px solid var(--card-line);border-radius:16px;padding:13px 13px 14px;background:#fff}
.agenda{margin-top:16px}
.agitem{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--card-line);border-radius:14px;
  padding:11px 12px;margin-bottom:9px;background:#fff}
.agitem .dbox{flex:none;width:40px;text-align:center;border-radius:10px;padding:5px 0;background:#F3F1F6}
.agitem .dbox .m{font-size:calc(8.5px*var(--fs));letter-spacing:.08em;text-transform:uppercase;color:var(--purple);font-weight:700}
.agitem .dbox .d{font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:calc(17px*var(--fs));font-weight:600;color:var(--purple-deep);line-height:1.05}
.agitem.gold .dbox{background:#F1EEF6}.agitem.gold .dbox .m{color:#5B4C7D}.agitem.gold .dbox .d{color:#4E4170}
.agitem .am h4{font-size:calc(12.5px*var(--fs));font-weight:600;line-height:1.25}
.agitem .am p{font-size:calc(10.5px*var(--fs));color:var(--mut);margin:2px 0 0;line-height:1.35}
.agitem .rm{margin-left:auto;flex:none;background:none;border:none;cursor:pointer;color:var(--mut);font-size:15px;
  line-height:1;padding:2px 2px 2px 6px;transition:.15s}
.agitem .rm:hover{color:var(--alert)}
.calbadge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:9px;background:var(--accent);
  color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:1.5px solid #fff}
.tb.cal{background:var(--accent);position:relative}
.icon-btn.rel{position:relative}
.tabbar{flex-wrap:wrap}
.tb{flex:0 0 auto;position:relative}
.tb-ai{flex:0 1 auto;min-width:0}
.calbadge{z-index:3}

@media(max-width:960px){
  .wrap{grid-template-columns:1fr;gap:30px;padding:24px 16px 48px}
  .console{position:static;order:1;text-align:center}
  .console p.lede{margin:0 auto}
  .console .role-row,.console .seg-row{justify-content:center}
  .stage{order:2}
  .panel{text-align:left}
  .notes li{text-align:left}
}
@media(max-width:430px){
  .phone{width:100%;max-width:374px;height:792px;border-radius:46px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

html,body{height:100%}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center}
.stage{width:100%;display:flex;justify-content:center;align-items:center;padding:24px 16px}

/* inputs: 16px stops iOS zooming the page when a field gets focus */
@media (hover:none) and (pointer:coarse){ .ai-input input,.cinput input{font-size:max(16px, calc(13px*var(--fs)))} }

/* On an actual phone the demo IS the screen: no bezel, no fake status bar */
@media (max-width:520px){
  html,body{background:#fff;overflow:hidden}
  body{display:block;min-height:0}
  .stage{display:block;padding:0;height:100%}
  .phone{width:100%;max-width:none;height:100%;min-height:0;border-radius:0;padding:0;background:#fff;box-shadow:none}
  .notch,.status{display:none}
  .screen{border-radius:0;padding-top:max(env(safe-area-inset-top,0px),10px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .vcall,.sheetwrap{border-radius:0}
  .vc-top{padding-top:calc(30px + env(safe-area-inset-top,0px))}

function navigatorHTML(){

     applied and names procedures, concerns that depend on procedures she does
     not perform drop out of the picker — exactly what "What changed" promised. */
  const narrowed = state.profileApplied && (P.offered||[]).length>0;
  const concerns = (narrowed ? matchedConcerns() : CONCERNS).map(c=>[c.k,c.l]);
  if(narrowed && navState.concern && !concerns.some(([k])=>k===navState.concern)) navState.concern=null;
  const chips = concerns.map(([k,l])=>`<button class="nchip" data-concern="${k}" aria-pressed="${navState.concern===k}">${l}</button>`).join('');
  return `<p>Start from the patient's primary concern, layer in their context, and the Builder surfaces the ALASTIN protocol, the chair-side talking points, and the matching training module.</p>
    <div class="navwrap">
      <div class="flab">Primary concern${narrowed?` <span class="flab-note">${concerns.length} of ${CONCERNS.length} · narrowed to what you perform</span>`:''}</div>
      <div class="nchips" id="cChips">${chips}</div>

function recoHTML(){
  const p = PATHWAYS[navState.concern];
  let ctx = [];
  ctx.push(navState.history==='first'
    ? 'First-time patient \u2014 start with two steps and a clear reason for each, not the whole shelf.'
    : 'Returning patient \u2014 check adherence and reorder timing before adding anything new.');
  ctx.push(navState.downtime==='low'
    ? 'Sensitive skin \u2014 introduce one active at a time and build frequency slowly.'
    : 'Tolerant skin \u2014 the full protocol can start at label frequency.');
  const loyalty = navState.history==='first'
    ? 'Enroll this patient in <b>Auto-Replenish</b> at checkout \u2014 first-visit sign-ups are what turn one purchase into a regimen.'
    : 'Apply an <b>Auto-Replenish</b> reward to the next shipment so the replenishment cycle never breaks.';
  let planBlock = '';
  if(navState.plan==='combo'){
    planBlock = `<h5>Full regimen</h5><ul>
      <li>Frame this concern as one step in a cleanse \u2192 treat \u2192 moisturize \u2192 protect routine.</li>
      <li>Full-regimen patients reorder more often and carry a materially larger basket.</li>
      <li>Sequence the introductions across visits so tolerance and budget both hold.</li></ul>`;
  }
  return `<div class="reco">
    <div class="brandname">${p.brand}</div>
    <span class="area">${p.area} · ${p.sub}</span>
    <h5>Consultation talking points</h5>
    <ul>${p.points.map(x=>`<li>${x}</li>`).join('')}</ul>
    <h5>Tailored to this patient</h5>
    <ul>${ctx.map(x=>`<li>${x}</li>`).join('')}</ul>
    ${planBlock}
    <div class="tie"><span>◆</span><p>${loyalty}</p></div>
    <div class="cta solid" style="margin:14px 0 0" data-act="train">Open protocol \u00b7 ${p.module}</div>
  </div>`;
}
function wireNavigator(){
  const root = screen.querySelector('#cChips'); if(!root) return;
  root.querySelectorAll('.nchip').forEach(c=>c.onclick=()=>{ navState.concern=c.dataset.concern; refreshReco(); root.querySelectorAll('.nchip').forEach(x=>x.setAttribute('aria-pressed', x.dataset.concern===navState.concern)); });
  [['#sHist','history'],['#sDown','downtime'],['#sPlan','plan']].forEach(([sel,key])=>{
    const g=screen.querySelector(sel);
    g.querySelectorAll('button').forEach(b=>b.onclick=()=>{ navState[key]=b.dataset.v; g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x.dataset.v===navState[key])); refreshReco(); });
  });
}
function refreshReco(){
  const out=screen.querySelector('#recoOut'); if(!out) return;
  out.innerHTML = navState.concern?recoHTML():'<div class="navempty"><div class="big">Select a primary concern</div><div>The Builder maps an ALASTIN protocol and the matching training module.</div></div>';
  wireActs();
}

/* ---- month grid ---- */
function monthGrid(cursor, selectedKey, opts){
  opts = opts||{};
  const y=cursor.getFullYear(), m=cursor.getMonth();
  const first=new Date(y,m,1).getDay(), len=new Date(y,m+1,0).getDate();
  let cells = DOW.map(d=>`<div class="dh">${d}</div>`).join('');
  for(let i=0;i<first;i++) cells+='<div class="calday mute"></div>';
  for(let d=1;d<=len;d++){
    const k=key(new Date(y,m,d));
    const has=opts.dots!==false && calFor(k).length>0;
    const isToday=k===key(TODAY);
    cells+=`<button class="calday${isToday?' today':''}" data-day="${k}" aria-pressed="${k===selectedKey}">${d}${has?'<span class="ev"></span>':''}</button>`;
  }
  return `<div class="calnav">
      <button data-mon="-1" aria-label="Previous month">‹</button>
      <b>${MONTHS[m]} ${y}</b>
      <button data-mon="1" aria-label="Next month">›</button>
    </div><div class="calgrid">${cells}</div>`;
}

function openCalSheet(title, sub, date, time){

function closeCalSheet(){ sheetState.open=false; const el=document.getElementById('calSheet'); if(el) el.remove(); }

  let el=document.getElementById('calSheet');
  if(!el){ el=document.createElement('div'); el.className='sheetwrap'; el.id='calSheet'; document.querySelector('.screen').appendChild(el); }
  el.innerHTML = `<div class="sheetscrim" data-close="1"></div>

      <div class="sub">${sheetState.title}${sheetState.sub?' · '+sheetState.sub:''}</div>

      <div class="flab">Time</div>
      <div class="timerow">${TIME_OPTIONS.map(t=>`<button class="timechip" data-time="${t}" aria-pressed="${t===sheetState.time}">${t}</button>`).join('')}</div>

  el.querySelectorAll('[data-mon]').forEach(b=>b.onclick=()=>{ sheetState.cursor.setMonth(sheetState.cursor.getMonth()+ +b.dataset.mon); drawSheet(); });
  el.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{ sheetState.time=b.dataset.time; drawSheet(); });

    const d=parseKey(sheetState.dateKey);

  };
}

}

function orderedModules(){
  const o=P.offered||[], st=(P.stocked||[]).concat(P.addNext||[]);
  /* if a module names procedures, those procedures decide it — a stocked category
     alone must not queue training for a procedure she just told us she doesn't do */
  const hit=m=> m.need ? m.need.some(n=>o.includes(n)) : (m.cat ? st.includes(m.cat) : false);
  const on=MODULES.filter(m=>hit(m)), off=MODULES.filter(m=>!hit(m)&&!m.always), always=MODULES.filter(m=>m.always&&!hit(m));
  return {on:on.concat(always), off};
}
/* ---------- the bridge: profile → module grid ----------
   Scores the same 16 tile ids the hub uses. The hub blends this with the
   lens × stage set (profile first, lens second), so the grid "What changed"
   previews is literally the grid Practice 360° opens on. */
function profileScores(){
  const o=P.offered||[], st=(P.stocked||[]).concat(P.addNext||[]);
  const any=a=>a.some(x=>o.includes(x));
  const S={}, R=[], add=(t,w)=>S[t]=(S[t]||0)+w, why=(txt,w)=>R.push([txt,w]);
  add('anatomy',130);
  if(any(RESURF)){ add('prepare',70); why('resurfacing on file',70); }
  if(any(INJECT)){ add('toparticles',56); add('prepare',24); why('injectables on file',56); }
  if(any(BODYP)){  add('centers',62); add('brands',34); why('body work on file',62); }
  if(o.includes('facial')) add('inclinic',38);
  if((P.addNext||[]).length){ add('brands',76); why('opening '+P.addNext.map(c=>CATNAME[c].toLowerCase()).join(' and '),76); }
  if(st.includes('tone')||st.includes('targeted')) add('articles',36);
  if(P.checkout==='desk'||P.checkout==='nobody'){ add('inclinic',82); why(P.checkout==='desk'?'front desk handles checkout':'nobody owns the checkout handover',82); }
  if(P.checkout==='aesthetician'){ add('inclinic',46); why('aestheticians hand product over',46); }
  if(P.postShare==='most'){ add('prepare',52); why('most patients seen post-procedure',52); }
  if(P.postShare==='third'){ add('grow',46); why('few patients seen post-procedure',46); }
  if(P.monthly>=300){ add('grow',50); why('high patient volume',50); }
  if(P.cadence==='rarely'){ add('online',48); why('resurfacing is occasional',48); }
  if(P.cadence==='weekly'){ add('conferences',36); }
  if(state.trig==='payout' && P.payMethod && P.payRecipient){ add('affiliate',90); why('payout confirmed',90); }
  /* tie-breakers so the grid is always full */
  add('grow',20); add('online',11); add('articles',8); add('conferences',5); add('faqs',3); add('mylearning',2);
  R.sort((x,y)=>y[1]-x[1]);
  return {S, reasons:R.map(x=>x[0])};
}
function hubTiles(applied){
  const set=tileSetFor(state.role,state.seg);
  if(!applied) return set;
  const {S,reasons}=profileScores();
  /* the lens × stage set orders the tail: 48 → 6 points, well under any profile signal */
  set.tiles.slice(0,8).forEach((id,i)=>S[id]=(S[id]||0)+(8-i)*6);
  const ranked=Object.entries(S).filter(([id])=>id!=='safety').sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0])).map(x=>x[0]);
  const tiles=ranked.slice(0,8).concat('safety');
  const lead=tiles.slice(0,2).map(id=>TILES_BASE[id]).join(' and ');
  const why = reasons.length
    ? `Built from the profile: ${reasons.slice(0,3).join(', ')}. ${lead} lead.`
    : `Built from the profile, but it does not say what she performs yet, so the grid follows the ${SEG[state.seg].name.split(' · ')[0]} stage.`;
  return {tiles, star:tiles[0], why};
}

function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

  const open=openShelf(), n=stockedCount();
  if(!open.length) return `<div class="callout">This practice stocks all ${CATS.length} categories — the conversation moves to depth per category and Auto-Replenish.</div>`;
  return `<div class="callout">This practice stocks ${n} of ${CATS.length} categories — ${open.map(x=>'<b>'+x+'</b>').join(open.length===2?' and ':', ')} ${open.length===1?'is':'are'} the open shelf.${(P.addNext||[]).length?` She has flagged ${joinAnd(P.addNext.map(c=>CATNAME[c].toLowerCase()))} as next.`:''}</div>`;
}
function shelfSentence(){
  const open=openShelf(), n=stockedCount(), have=joinAnd((P.stocked||[]).map(c=>CATNAME[c].toLowerCase()));

}

/* ---------- 1. messages ---------- */
let mlog=[];              /* the thread, as data — so a re-render never loses it */
let clockMin=0;
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }
function stamp(){
  const c=TRIG().clock; let t=c[0]*60+c[1]+clockMin; clockMin+=1;
  const h=Math.floor(t/60)%24, m=t%60, ap=h<12?'AM':'PM', hh=(h%12)||12;
  return `${hh}:${String(m).padStart(2,'0')} ${ap}`;
}
function addLog(e){ mlog.push(e); paintThread(); }
function dropTyping(){ mlog=mlog.filter(e=>e.k!=='typing'); }
function paintThread(){
  const th=document.getElementById('thread'); if(!th) return;
  th.innerHTML='<div class="tday">Today</div>'+mlog.map(e=>{
    if(e.k==='typing') return '<div class="typing3"><i></i><i></i><i></i></div>';
    if(e.k==='link')   return linkHTML();
    if(e.k==='sys')    return `<div class="bub sys">${e.x}</div>`;
    return `<div class="bub ${e.k}">${e.x}<span class="bt">${e.tm}</span></div>`;
  }).join('');
  th.scrollTop=th.scrollHeight;
}
function linkHTML(){
  const T=TRIG();
  return `<div class="linkcard" onclick="openProfile()">
      <div class="lc-top"><div class="wm">Alastin</div><div class="lu">secure.alastin-practice.com/profile · expires in 24h</div></div>
      <div class="lc-b"><b>${T.linkTitle}</b><span>${T.linkSub}</span>
        <div class="lc-go">Open <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${SVG.arrow}</svg></div>
      </div></div>`;
}
function renderMessages(){
  screen.innerHTML=statusBar()+`
    <div class="msghead"><div class="mav">AL</div>
      <div class="mm"><b>ALASTIN</b><span>Practice messages · verified sender</span></div>
      <span class="mx">SMS</span></div>
    <div class="thread" id="thread"></div>
    <div class="composer" id="composer"></div>`;
  paintThread();
  if(!mlog.length) playNode(TRIG().start,true); else drawComposer();
}

/* play one node: typing indicator, each inbound line, then the link card */
function playNode(id,initial){
  const node=TRIG().nodes[id]; if(!node) return;
  state.node=id; state.playing=true; drawComposer();
  let d=initial?300:380;
  node.in.forEach(txt=>{
    timers.push(setTimeout(()=>addLog({k:'typing'}), d)); d+=640;
    timers.push(setTimeout(()=>{ dropTyping(); addLog({k:'in',x:txt.replace('{PCT}',pct()),tm:stamp()}); }, d)); d+=430;
  });
  if(node.link){ timers.push(setTimeout(()=>addLog({k:'link'}), d)); d+=260; }
  timers.push(setTimeout(()=>{ state.playing=false; drawComposer(); }, d));
}

/* ---- composer: numbered quick replies + free text ---- */
function drawComposer(){
  const c=document.getElementById('composer'); if(!c) return;
  const node=TRIG().nodes[state.node]||{opts:[]};
  const opts=state.playing?[]:(node.opts||[]);
  const chips=state.optedOut
    ? `<button class="qr" onclick="sendReply('START')"><b>&#8631;</b>Reply START to resume</button>`
    : opts.map(o=>`<button class="qr" onclick="sendReply('${o.n}')"><b>${o.n}</b>${o.label}</button>`).join('');
  const hint = state.optedOut ? 'Opted out · no further messages'
    : state.playing ? 'ALASTIN is typing…'
    : opts.length ? 'Tap a number, or type your own reply'
    : 'Thread complete · tap the card above, or reply STOP / HELP';
  c.innerHTML=`
    <div class="cutil"><span class="chint">${hint}</span>
      <button class="cu" onclick="replayThread()">&#8634; Replay</button>
      <button class="cu" onclick="skipThread()">Skip to link</button></div>
    ${chips?`<div class="qreplies">${chips}</div>`:''}
    <div class="cinput">
      <input id="smsIn" placeholder="Type a reply…" autocomplete="off" ${state.playing?'disabled':''}
        onkeydown="if(event.key==='Enter'){sendReply(this.value); this.value='';}">
      <button aria-label="Send" onclick="const i=document.getElementById('smsIn'); sendReply(i.value); i.value='';">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button></div>`;
}

/* ---- what the practitioner tapped or typed ---- */
function sendReply(raw){
  const txt=(raw||'').trim(); if(!txt || state.playing) return;
  clearTimers(); dropTyping();
  addLog({k:'out',x:escHTML(txt),tm:stamp()});
  const t=txt.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();
  const node=TRIG().nodes[state.node]||{opts:[]};

  if(t==='stop'||t==='unsubscribe'||t==='quit'){
    state.optedOut=true; state.playing=true; drawComposer();
    timers.push(setTimeout(()=>{ addLog({k:'sys',x:'You are unsubscribed from ALASTIN practice messages. Reply START to resume.'});
      state.playing=false; drawComposer(); },460));
    return;
  }
  if(t==='start'){
    state.optedOut=false;
    timers.push(setTimeout(()=>{ addLog({k:'sys',x:'Resubscribed. Picking up where we left off.'}); playNode(state.node); },460));
    state.playing=true; drawComposer(); return;
  }
  if(state.optedOut){ state.playing=false; drawComposer(); return; }
  if(t==='help'||t==='info'){
    state.playing=true; drawComposer();
    timers.push(setTimeout(()=>{ addLog({k:'sys',x:'ALASTIN practice messages · msg &amp; data rates may apply · reply STOP to opt out · for anything urgent call your consultant.'}); },460));
    timers.push(setTimeout(()=>playNode(state.node),1000));
    return;
  }
  /* a number they tapped or typed */
  const num=t.match(/^([1-9])\b/);
  if(num){ const o=(node.opts||[]).find(o=>String(o.n)===num[1]); if(o){ playNode(o.go); return; } }
  /* words we recognise */
  const kw=(node.opts||[]).find(o=>(o.kw||[]).some(k=>t.includes(k)));
  if(kw){ playNode(kw.go); return; }
  /* anything else — hand it to a person and re-offer rather than dead-end */
  state.playing=true; drawComposer();
  timers.push(setTimeout(()=>addLog({k:'typing'}),380));
  timers.push(setTimeout(()=>{ dropTyping(); addLog({k:'in',x:offerAgain(node),tm:stamp()});
    state.playing=false; drawComposer(); },1050));
}
function offerAgain(node){
  const who=TRIG().owner;
  if(node.fallback) return node.fallback;
  if(!node.opts||!node.opts.length) return `I've passed that to ${who}, who picks it up from here. The link above is still live.`;
  const list=node.opts.map(o=>`<b>${o.n}</b> ${o.label.toLowerCase()}`).join(' · ');
  return `I didn't catch that, and I'd rather hand you to a person than guess — ${who} has your message. In the meantime: ${list}.`;
}
function escHTML(x){ return x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function replayThread(){
  clearTimers(); mlog=[]; clockMin=0; P=freshProfile();
  Object.assign(state,{optedOut:false,node:TRIG().start,sec:null,guided:false,leftDeep:false,landedOn:null});
  renderMessages();
}
function skipThread(){
  clearTimers(); mlog=[]; clockMin=0; P=freshProfile();
  Object.assign(state,{optedOut:false,sec:null,guided:false,leftDeep:false,landedOn:null});
  const T=TRIG(), s0=T.nodes[T.start], ln=T.nodes.link;
  s0.in.forEach(x=>mlog.push({k:'in',x:x.replace('{PCT}',pct()),tm:stamp()}));
  mlog.push({k:'out',x:'1',tm:stamp()});
  ln.in.forEach(x=>mlog.push({k:'in',x:x.replace('{PCT}',pct()),tm:stamp()}));
  mlog.push({k:'link'});
  state.node='link'; state.playing=false; paintThread(); drawComposer();
}
/* the text said where it would take her, so the link honours it */
function openProfile(){
  clearTimers();
  const deep=TRIG().deep, target=sections().find(x=>x.id===deep);
  const land = (target && !secDone(target)) ? target : (deep ? nextRequired() : null);
  if(land){ state.sec=land.id; state.landedOn=land.id; state.guided=true; state.screen='section'; }
  else { state.guided=false; state.screen='profile'; }
  render();
}

function renderSection(){
  const s=SECTIONS.find(x=>x.id===state.sec), p=pct(), d=secDone(s);
  const arrived = state.guided && !state.leftDeep && state.sec===state.landedOn;
  const banner = arrived ? `<div class="arrived">
      <span class="ai2">${ic('link2')}</span>
      <div><b>Straight from your text</b><span>${TRIG().linkSub.replace(/\.$/,'')} — this is the section it needed.</span></div>
      <button class="av2" onclick="viewFullProfile()">Full profile</button></div>` : '';
  const nxt = d ? nextRequired() : null;
  let cta, hint;
  if(!d){ cta={label:'Back',act:'backToProfile()'}; hint='Unanswered items stay flagged on the profile.'; }
  else if(nxt){ cta={label:'Next: '+shortName(nxt),act:`openSec('${nxt.id}')`}; hint=`Done. One more the text asked for.`; }
  else if(requiredDone()){ cta={label:'See what changed',act:'finishProfile()'}; hint=pct()===100?'Everything we need is on file.':`Everything the text asked for is done. ${pct()}% overall.`; }
  else { cta={label:'Done',act:'backToProfile()'}; hint='This section is done.'; }
  screen.innerHTML=statusBar()+`<div class="detail fade">
      <div class="dhead"><button class="back" onclick="backToProfile()">${BACK}</button>
        <div class="dt">${s.name}<small>${p}% complete · ${s.fields.filter(filled).length} of ${s.fields.length} on this page</small></div></div>
      <div class="dbody">${banner}${sectionBody(s.id)}</div>
    </div>
    <div class="savebar"><span class="sc">${hint}</span>
      <button onclick="${cta.act}">${cta.label}</button></div>`;
  wireSection();
}
function shortName(x){ return x.short||x.name; }
function viewFullProfile(){ state.leftDeep=true; backToProfile(); }
function wireSection(){
  screen.querySelectorAll('[data-multi]').forEach(g=>{
    const key=g.dataset.multi, single=g.dataset.single==='1';
    g.querySelectorAll('.mchip').forEach(b=>b.onclick=()=>{
      const v=b.dataset.v;
      if(single){ P[key]=v; }
      else { const cur=P[key]||[]; P[key]= cur.includes(v)? cur.filter(x=>x!==v) : cur.concat(v); if(!P[key].length) P[key]=null; }
      /* a category cannot be both stocked and "open next" */
      if(key==='stocked' && P.addNext){ P.addNext=P.addNext.filter(x=>!(P.stocked||[]).includes(x)); if(!P.addNext.length) P.addNext=null; }
      renderSection();
    });
  });
  screen.querySelectorAll('[data-step]').forEach(g=>{
    const key=g.dataset.step, min=+g.dataset.min, max=+g.dataset.max, inc=key==='monthly'?20:1;
    g.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const base = P[key]===null ? (key==='monthly'?100:1) : P[key];
      const next = P[key]===null ? base : base + (+b.dataset.d)*inc;
      P[key]=Math.max(min,Math.min(max,next));
      renderSection();
    });
  });
  screen.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{ P[b.dataset.sw]=!P[b.dataset.sw]; renderSection(); });
}
function backToProfile(){ state.screen='profile'; render(); }
function finishProfile(){ state.screen='changed'; render(); toast('Profile saved · app updated'); }

/* ---------- 4. what changed ---------- */
function renderChanged(){
  const T=TRIG();
  const mc=matchedConcerns(), om=orderedModules(), tiles=afterTiles();
  const concernPills=CONCERNS.map(c=>{
    const on=mc.some(m=>m.k===c.k);
    return `<span class="pill2 ${on?'on':'off'}">${c.l}</span>`;
  }).join('');
  const modRows=om.on.map((m,i)=>`<div class="ordrow"><span class="on2">${i+1}</span><span>${m.n}</span><span class="otag">${i===0?'Next up':'Queued'}</span></div>`).join('')
    + om.off.map(m=>`<div class="ordrow dim"><span class="on2">·</span><span>${m.n}</span><span class="otag">Not your mix</span></div>`).join('');
  /* she can reach this screen having answered only what the text asked for.
     Where an input is still missing, say so — do not claim a narrowing we
     have no basis for. */
  const hasProcs=(P.offered||[]).length>0;
  const hasCats=(P.addNext||[]).length>0 || (P.stocked||[]).length>3;
  const unlock = state.trig==='payout' ? `<div class="unlock">
      <div class="ul">Released tonight</div><div class="amt">$4,180</div>
      <div class="us">August practice share, held pending confirmation. Both boxes are now ticked, so it goes out in tonight&rsquo;s run.</div></div>` : '';
  screen.innerHTML=statusBar()+`<div class="detail fade">
      <div class="dhead"><button class="back" onclick="backToProfile()">${BACK}</button>
        <div class="dt">What changed<small>Computed from what you entered</small></div></div>
      <div class="dbody">
        <p>${(pct()<100 && T.hubNotePartial) ? T.hubNotePartial : T.hubNote}</p>
        ${unlock}
        <div class="diff" style="animation-delay:.04s">
          <h4><span class="dic">${ic('grid')}</span>Your 360° module grid</h4>
          <div class="wasnow"><span class="was">Generic six</span><span class="arw">→</span><span class="now">${hasProcs?'Built from your mix':'Reordered by what you confirmed'}</span></div>
          <div class="gridlab">Before</div>
          <div class="minitiles before">${GENERIC_TILES.map(t=>`<div class="mt2">${t}</div>`).join('')}</div>
          <div class="gridlab">After</div>
          <div class="minitiles">${tiles.map(t=>`<div class="mt2 ${GENERIC_TILES.includes(t)?'':'newin'}">${t}</div>`).join('')}</div>
        </div>
        <div class="diff" style="animation-delay:.1s">
          <h4><span class="dic">${ic('target')}</span>Regimen Builder</h4>
          ${hasProcs
            ? `<div class="wasnow"><span class="was">13 concerns, all of them</span><span class="arw">→</span><span class="now">${mc.length} you actually treat</span></div>
               <div class="pillrow">${concernPills}</div>
               <p style="margin-top:9px">Struck-through concerns depend on procedures you did not select. They stop appearing in the picker.</p>`
            : `<div class="wasnow"><span class="was">13 concerns</span><span class="arw">→</span><span class="now">still 13</span></div>
               <p style="margin-top:9px">We still don&rsquo;t know which procedures you perform, so the picker stays exactly as it was. Add them and this list narrows to what you actually treat.</p>`}
        </div>
        <div class="diff" style="animation-delay:.16s">
          <h4><span class="dic">${ic('cap')}</span>Training order</h4>
          ${(hasProcs||hasCats)
            ? `<div class="wasnow"><span class="was">Catalog order</span><span class="arw">→</span><span class="now">Your mix first</span></div>${modRows}`
            : `<div class="wasnow"><span class="was">Catalog order</span><span class="arw">→</span><span class="now">unchanged</span></div>
               <p style="margin-top:9px">Training reorders off your procedures and categories. Neither is on file yet, so this stays in catalog order.</p>`}
        </div>
        ${stillOpenHTML()}
        <div class="cta solid" style="margin:14px 0 0" onclick="state.screen='handoff';render()">Open Practice 360°</div>
        <div class="src">Every line on this screen is derived from your entries, not scripted &mdash; including the parts that say nothing changed. Change an answer and this screen changes with it.</div>
      </div></div>`;
}

/* ---------- 5. handoff ---------- */
function stillOpenHTML(){
  const open=sections().filter(x=>!secDone(x));
  if(!open.length) return '';
  return `<div class="diff" style="animation-delay:.22s">
    <h4><span class="dic">${ic('info')}</span>Still on the table · ${pct()}% complete</h4>
    <p>You gave us what the text asked for. These are the ones we did not ask about yet, and what each would sharpen.</p>
    ${open.map(x=>`<div class="ordrow dim hint"><span class="on2">+</span><span class="oname">${x.name}</span>
        <span class="otag">${UNLOCKS[x.id]}</span></div>`).join('')}
    <div class="cta" style="margin:12px 0 0;padding:10px" onclick="state.guided=false;state.leftDeep=true;backToProfile()">Finish the rest</div>
  </div>`;
}

function renderHandoff(){
  const tiles=afterTiles();
  screen.innerHTML=statusBar()+brandBar(`<div class="appbar-row"><span class="prov-pill">Practice Partner</span>
      <div style="display:flex;gap:8px"><button class="icon-btn" title="Text size" onclick="toggleFont()">${TT}</button></div></div>
    <div class="specialty"><span class="d"></span>${P.specialty} · Bellevue, WA · Profile ${pct()}%</div>`)+`
    <div class="body fade"><div class="pwrap">
      <div class="hoff">
        <div class="hg"><div class="av2">EV</div><div><b>Good morning — Dr. Elena Voss</b><span>${pct()===100?'Profile complete · protocols now matched':`Profile ${pct()}% · matched to what you told us`}</span></div></div>
        <div class="sec" style="margin:16px 0 8px;padding:0">360° Modules · yours</div>
        <div class="minitiles">${tiles.map(t=>`<div class="mt2 ${GENERIC_TILES.includes(t)?'':'newin'}">${t}</div>`).join('')}</div>
        <div class="src" style="margin-top:13px">Your profile is now the account. <b>Practice 360°</b> opens on the grid above, the Regimen Builder narrows to what you perform, and training queues in your order.</div>
      </div>
      <div class="cta solid" style="margin:14px 0 0" onclick="enterApp()">Continue to Practice 360°</div>
      <div class="cta" style="margin:9px 0 0" onclick="restart()">&#8634; Run it again</div>
    </div></div>`;
}

/* ---------- helpers ---------- */
function toggleFont(){
  state.fontStep=(state.fontStep+1)%FONT_STEPS.length;
  document.documentElement.style.setProperty('--fs',FONT_STEPS[state.fontStep]);
  render(); toast(FONT_LABELS[state.fontStep]+' · '+Math.round(FONT_STEPS[state.fontStep]*100)+'%');
}
let toastT=null;
/* the toast lives on .phone, not .screen, so a re-render can't wipe it mid-message */
function toast(msg){
  let el=document.querySelector('.toast');
  if(!el){ el=document.createElement('div'); el.className='toast'; document.querySelector('.phone').appendChild(el); }
  /* sit above whatever bottom bar this screen happens to have */
  const bar=document.querySelector('.composer,.savebar,.tabbar');
  el.style.bottom=((bar?bar.getBoundingClientRect().height:0)+52)+'px';
  el.textContent=msg; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1900);
}

/* ============================================================ THE SEAM
   enterApp(): the profile becomes the account and Practice 360° opens.
   openProfileFromApp(): the app can send her back to fix the profile.
   applyAndReturn(): the profile hub's back button re-derives the app. */
function stampNow(){ const c=TRIG().clock; let t=c[0]*60+c[1]+clockMin; const h=Math.floor(t/60)%24,m=t%60; return `${(h%12)||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`; }
function enterApp(){
  clearTimers(); closeCalSheet();
  state.profileApplied=true; state.appliedAt=stampNow(); state.fromApp=false;
  aiLog=[]; navStack=['role']; tileSwap=true;
  Object.assign(navState,{concern:null,history:'first',downtime:'low',plan:'single'});
  state.screen='hub'; render();
  toast('Profile applied · Practice 360° rebuilt');
}
function openProfileFromApp(){
  closeCalSheet();
  Object.assign(state,{fromApp:true,guided:false,leftDeep:true,landedOn:null,sec:null});
  state.screen='profile'; render();
}
function profileTouched(){ return JSON.stringify(P)!==JSON.stringify(freshProfile()); }
/* the header button on the profile hub. If she has changed anything, the app re-derives
   from it; if the profile is untouched, the app opens as it would without one. */
function goToApp(){
  closeCalSheet(); clearTimers();
  if(profileTouched()){ applyAndReturn(); return; }
  state.fromApp=false; navStack=['role']; tileSwap=true; state.screen='hub'; render();
  toast('Practice 360° · profile not applied yet');
}
function applyAndReturn(){
  state.profileApplied=true; state.appliedAt=stampNow(); state.fromApp=false;
  tileSwap=true; navStack=['role']; state.screen='hub'; render();
  toast('Profile saved · app updated');
}

/* ---------- resets ---------- */
function freshRun(){
  clearTimers(); closeCalSheet(); P=freshProfile(); mlog=[]; clockMin=0; aiLog=[]; navStack=[]; calSelected=null;
  Object.assign(navState,{concern:null,history:'first',downtime:'low',plan:'single'});
  Object.assign(state,{sec:null,node:null,playing:false,optedOut:false,guided:false,leftDeep:false,landedOn:null,
                       profileApplied:false,appliedAt:null,fromApp:false,_detailId:null});
  seedCalendar();
}
/* Restart from the text: the whole story, from the SMS, on the selected trigger */
function restart(){ freshRun(); state.screen='messages'; render(); }
/* Skip to Practice 360°: the app on its own, with no profile applied, so the
   difference a completed profile makes is visible from the other direction */
function skipToApp(){ freshRun(); state.screen='role'; render(); }

function syncConsole(){}
